[alembic]
script_location = alembic
file_template = %%(rev)s_%%(slug)s

sys_path = .

sqlalchemy.url = postgresql://dirs_user:dirs_password_secure@localhost:5432/dirs_db

[post_write_hooks]

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
