version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: dirs_postgres
    restart: always
    environment:
      POSTGRES_USER: dirs_user
      POSTGRES_PASSWORD: dirs_password_secure
      POSTGRES_DB: dirs_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dirs_user -d dirs_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dirs_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: dirs_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://dirs_user:dirs_password_secure@postgres:5432/dirs_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dirs_jwt_secret_key_super_secure_change_me_in_production
      - ENVIRONMENT=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    container_name: dirs_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
